[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perch"
version = "0.5.0"
description = "AI cockpit camera: post-flight debrief from a wide scene sensor and a narrow instrument sensor."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
perch = "perch.cli:main"

[tool.setuptools.packages.find]
include = ["perch*"]

[tool.setuptools.package-data]
perch = ["prompts/*.md", "prompts/modules/*.md", "templates/*.j2", "perch.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
